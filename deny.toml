# cargo-deny policy (docs/v0.1/02: dependency and licence audit). Owner: DHARSHAN.
# Run: cargo deny check

[graph]
all-features = true

[advisories]
# RustSec advisory DB. Vulnerabilities and unsound crates fail the build;
# unmaintained crates are reported for workspace (direct) dependencies.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. Additions need a PR reviewed by the tech lead.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

# Workspace crates are proprietary and never published.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Never re-introduce the stale isolation-forest crate (docs/v0.1/02).
    { name = "extended-isolation-forest" },
    # OpenSSL is not used; rustls only.
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
