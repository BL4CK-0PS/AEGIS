[workspace]
members = [
    "crates/aeris-types",
    "crates/aeris-trust",
    "crates/aeris-decision",
    "crates/aeris-core",
    "crates/aeris-graph",
    "apps/aeris-console",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kishanth <kisanthr22@gmail.com>"]
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rand = "0.8"
rand_chacha = "0.3"
petgraph = "0.8.3"
