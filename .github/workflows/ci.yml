# AERIS CI. Owner: DHARSHAN. Every job must pass for a merge to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Pinned toolchain (rust-toolchain.toml).
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  checks:
    name: fmt · check · clippy · test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      - uses: Swatinem/rust-cache@v2
      # Protobuf types are generated by build.rs with protox (pure Rust):
      # no protoc install step; a broken .proto fails `cargo check`.
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check --workspace --all-targets --all-features --locked
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo test (includes G2 S4 x 20 seeds, AI off)
        run: cargo test --workspace --all-features --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  nats-e2e:
    name: NATS JetStream + PostgreSQL end-to-end (compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - name: Generate throwaway credentials
        run: |
          umask 077
          rp() { head -c 24 /dev/urandom | base64 | tr -d '/+='; }
          sed -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(rp)|" \
              -e "s|^NATS_SIMD_PASSWORD=.*|NATS_SIMD_PASSWORD=$(rp)|" \
              -e "s|^NATS_SERVER_PASSWORD=.*|NATS_SERVER_PASSWORD=$(rp)|" \
              deploy/.env.example > deploy/.env
      - name: Start Postgres 18 + NATS 2.15 (wait for healthy)
        run: docker compose -f deploy/compose.yaml up -d --wait
      - name: NATS end-to-end tests
        run: |
          set -a; . deploy/.env; set +a
          export AERIS_TEST_NATS_URL=nats://127.0.0.1:4222
          export AERIS_TEST_SIMD_USER="$NATS_SIMD_USER" AERIS_TEST_SIMD_PASSWORD="$NATS_SIMD_PASSWORD"
          export AERIS_TEST_SERVER_USER="$NATS_SERVER_USER" AERIS_TEST_SERVER_PASSWORD="$NATS_SERVER_PASSWORD"
          cargo test -p aeris-harness --test nats_e2e --locked -- --ignored --test-threads=1 --nocapture
      - name: PostgreSQL audit-chain test (migrations/0001_init.sql)
        run: |
          set -a; . deploy/.env; set +a
          export AERIS_TEST_DATABASE_URL="postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:${POSTGRES_PORT##*:}/$POSTGRES_DB"
          cargo test -p aeris-harness --test pg_audit --locked -- --ignored --nocapture
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
