# AERIS NATS server (JetStream). Owner: DHARSHAN.
# Credentials are injected from the environment ($VAR references are resolved
# by nats-server at start-up); nothing secret is stored in this file.

server_name: $NATS_SERVER_NAME
listen: 0.0.0.0:4222
# Monitoring (healthz) — published to localhost only by compose.
http: 0.0.0.0:8222

# Largest AERIS envelope is 64 KiB (aeris-wire MAX_ENVELOPE_BYTES).
max_payload: 65536
max_connections: 256

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 256MB
  max_file_store: 4GB
}

# TLS: enabled in the DC overlay (deploy/nats/tls.conf.example), off locally.

authorization {
  # Clients must authenticate within this many seconds.
  timeout: 2
  users = [
    # Simulator: publishes events, answers commands. May create/inspect only
    # its own stream.
    {
      user: $NATS_SIMD_USER
      password: $NATS_SIMD_PASSWORD
      permissions: {
        publish: {
          allow: [
            "aeris.events.>",
            "_INBOX.>",
            "$JS.API.INFO",
            "$JS.API.STREAM.INFO.AERIS_EVENTS",
            "$JS.API.STREAM.CREATE.AERIS_EVENTS"
          ]
        }
        subscribe: { allow: ["aeris.cmd.>", "_INBOX.>"] }
      }
    }
    # Control plane: consumes events via JetStream, sends commands.
    {
      user: $NATS_SERVER_USER
      password: $NATS_SERVER_PASSWORD
      permissions: {
        publish: { allow: ["aeris.cmd.>", "$JS.API.>", "$JS.ACK.>", "_INBOX.>"] }
        subscribe: { allow: ["_INBOX.>", "aeris.events.>"] }
      }
    }
  ]
}
