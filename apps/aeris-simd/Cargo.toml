[package]
name = "aeris-simd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Dharshan"]
license.workspace = true
publish.workspace = true
description = "AERIS simulator daemon: signed events to NATS JetStream, authenticated commands in"

[[bin]]
name = "aeris-simd"
path = "src/main.rs"

[dependencies]
aeris-types = { path = "../../crates/aeris-types" }
aeris-wire = { path = "../../crates/aeris-wire" }
aeris-crypto = { path = "../../crates/aeris-crypto" }
aeris-sim = { path = "../../crates/aeris-sim" }
aeris-exec = { path = "../../crates/aeris-exec" }
async-nats = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
aeris-core = { path = "../../crates/aeris-core" }
aeris-exec = { path = "../../crates/aeris-exec", features = ["nats"] }
tempfile = { workspace = true }
